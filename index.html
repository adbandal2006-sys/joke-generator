<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Chat Room</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <!-- Logo -->
            <div class="logo-section">
                <div class="logo">
                    <i class="fas fa-comments"></i>
                </div>
                <h2>ChatRoom</h2>
            </div>

            <!-- Channels -->
            <div class="channels-section">
                <h3 class="section-title">
                    <span>Channels</span>
                    <button id="addChannelBtn" class="btn-icon" title="Add Channel">
                        <i class="fas fa-plus"></i>
                    </button>
                </h3>
                <div class="channels-list">
                    <div class="channel active" data-channel="general">
                        <i class="fas fa-hashtag"></i>
                        <span>general</span>
                    </div>
                    <div class="channel" data-channel="random">
                        <i class="fas fa-hashtag"></i>
                        <span>random</span>
                    </div>
                    <div class="channel" data-channel="gaming">
                        <i class="fas fa-hashtag"></i>
                        <span>gaming</span>
                    </div>
                    <div class="channel" data-channel="tech">
                        <i class="fas fa-hashtag"></i>
                        <span>tech</span>
                    </div>
                </div>
            </div>

            <!-- Users Online -->
            <div class="users-section">
                <h3 class="section-title">
                    <span>Online Users</span>
                    <span class="online-count">0</span>
                </h3>
                <div class="users-list" id="usersList">
                    <p class="empty-state">No users online</p>
                </div>
            </div>

            <!-- User Profile -->
            <div class="user-profile">
                <div class="profile-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <div class="profile-info">
                    <p class="username" id="currentUsername">Guest</p>
                    <p class="status">🟢 Online</p>
                </div>
                <button id="logoutBtn" class="btn-icon" title="Logout">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-container">
            <!-- Header -->
            <header class="chat-header">
                <div class="header-left">
                    <i class="fas fa-hashtag"></i>
                    <h1 id="currentChannelName">general</h1>
                </div>
                <div class="header-right">
                    <button class="btn-icon" title="Member List">
                        <i class="fas fa-users"></i>
                    </button>
                    <button class="btn-icon" title="Settings">
                        <i class="fas fa-cog"></i>
                    </button>
                </div>
            </header>

            <!-- Messages Area -->
            <div class="messages-area" id="messagesArea">
                <div class="welcome-message">
                    <div class="welcome-icon">
                        <i class="fas fa-comments"></i>
                    </div>
                    <h2>Welcome to #general</h2>
                    <p>This is the start of the #general channel</p>
                </div>
            </div>

            <!-- Typing Indicator -->
            <div class="typing-indicator" id="typingIndicator">
                <p id="typingText"></p>
            </div>

            <!-- Input Area -->
            <div class="input-section">
                <div class="input-wrapper">
                    <button class="btn-icon btn-attach" title="Attach File">
                        <i class="fas fa-paperclip"></i>
                    </button>
                    <input 
                        type="text" 
                        id="messageInput" 
                        placeholder="Message #general" 
                        class="message-input"
                    >
                    <div class="input-buttons">
                        <button class="btn-icon btn-emoji" title="Emoji">
                            <i class="fas fa-smile"></i>
                        </button>
                        <button id="sendBtn" class="btn-send" title="Send Message">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Login Modal -->
        <div class="modal" id="loginModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Join Chat Room</h2>
                </div>
                <div class="modal-body">
                    <input 
                        type="text" 
                        id="usernameInput" 
                        placeholder="Enter your username" 
                        class="username-input"
                        maxlength="20"
                    >
                    <small>Username must be 3-20 characters</small>
                </div>
                <div class="modal-footer">
                    <button id="joinBtn" class="btn btn-primary">Join Chat</button>
                </div>
            </div>
        </div>

        <!-- Add Channel Modal -->
        <div class="modal" id="channelModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Create Channel</h2>
                    <button class="btn-close" id="closeChannelModal">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="modal-body">
                    <input 
                        type="text" 
                        id="channelNameInput" 
                        placeholder="Channel name (lowercase, no spaces)" 
                        class="channel-input"
                    >
                </div>
                <div class="modal-footer">
                    <button id="createChannelBtn" class="btn btn-primary">Create</button>
                    <button id="cancelChannelBtn" class="btn btn-secondary">Cancel</button>
                </div>
            </div>
        </div>

        <!-- Emoji Picker Modal -->
        <div class="modal" id="emojiModal">
            <div class="modal-content emoji-picker">
                <div class="modal-header">
                    <h2>Pick an Emoji</h2>
                    <button class="btn-close" id="closeEmojiModal">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="emoji-grid" id="emojiGrid">
                    <!-- Emojis will be added here -->
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
